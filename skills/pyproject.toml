[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-skills"
version = "1.0.0"
description = "Personal AI agents and skills for coding assistants (OpenCode, Claude Code, Cursor, Windsurf)"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
agents-skills-setup = "setup:main"

[tool.setuptools]
py-modules = ["setup"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
