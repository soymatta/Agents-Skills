[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-skills"
version = "1.0.0"
description = "Personal AI agents and skills for coding assistants (OpenCode, Claude Code, Cursor, Windsurf)"
requires-python = ">=3.11"
license = {text = "MIT"}

# Config-only package: the installer runs as `python setup.py` from the repo
# root, so no console entry point or module is shipped here.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]