name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests bandit
          if [ -f skills/requirements.txt ]; then pip install -r skills/requirements.txt; fi

      - name: Security scan (bandit, first-party, blocking on high)
        # .bandit.toml excludes third-party skills (impeccable/skill-creator/
        # ai-job-search). -lll reports only HIGH severity; no `|| true` so the
        # build fails when a high-severity issue is found in first-party code.
        run: bandit -c .bandit.toml -r skills/ -lll

      - name: Validate SKILL.md files exist
        run: |
          for skill in skills/*/; do
            skill_name=$(basename "$skill")
            if [[ "$skill_name" == .* ]]; then
              # Skip caches and generated dirs (e.g. .pytest_cache)
              continue
            fi
            if [ -f "$skill/SKILL.md" ]; then
              echo "OK: $skill_name has SKILL.md"
            elif [ -d "$skill/scripts" ] || [ -d "$skill/templates" ]; then
              echo "SKIP: $skill_name is infrastructure (scripts/templates only)"
            else
              echo "ERROR: $skill_name has no SKILL.md and is not infrastructure"
              exit 1
            fi
          done
          echo "All skill directories validated"

      - name: Doc-vs-code coherence (scripts cited in docs must exist)
        run: python .github/scripts/check_doc_code_coherence.py

      - name: Validate agents exist
        run: |
          for agent in agents/*.md; do
            if [ ! -f "$agent" ]; then
              echo "ERROR: No agent files found"
              exit 1
            fi
          done
          echo "All agents present"

      - name: Run setup.py syntax check
        run: python -c "import py_compile; py_compile.compile('setup.py', doraise=True)"

      - name: Run skill tests
        run: |
          failed=0
          for skill_dir in skills/*/; do
            if [ -d "$skill_dir/tests" ]; then
              skill_name=$(basename "$skill_dir")
              echo "=== Testing $skill_name ==="
              cd "$skill_dir"
              if python -m pytest tests/ -v; then
                echo "PASS: $skill_name"
              else
                echo "FAIL: $skill_name"
                failed=1
              fi
              cd ../..
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "Some skill tests failed"
            exit 1
          fi
          echo "All skill tests passed"
